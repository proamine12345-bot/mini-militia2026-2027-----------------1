<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#081018"><title>Frontline Pocket</title><link rel="stylesheet" href="css/game.css"></head><body><canvas id="game"></canvas><div id="lobby" class="screen"><div class="brand"><span class="brand-mark">✦</span><div><b>FRONTLINE</b><small>POCKET ARENA</small></div></div><div class="profile-card"><div class="avatar">A</div><div><b id="profileName">جندي جديد</b><small>المستوى <span id="profileLevel">1</span> • <span id="profileCoins">1200</span> عملة</small></div></div><div class="mode-grid"><button data-mode="survival" class="mode active"><strong>⚔️ بقاء</strong><small>قاتل موجات الأعداء</small></button><button data-mode="team" class="mode"><strong>🛡️ معركة فرق</strong><small>فريقان ضد بعضهما</small></button><button data-mode="duel" class="mode"><strong>🔥 مبارزة</strong><small>مواجهة سريعة</small></button><button data-mode="training" class="mode"><strong>🎯 تدريب</strong><small>جرّب الأسلحة</small></button></div><div class="menu-row"><button id="play">ابدأ المعركة</button><button id="loadout">الترسانة</button><button id="stats">الإحصائيات</button><button id="settings">الإعدادات</button></div><div class="hint">للهاتف: عصا الحركة يسار الشاشة • التصويب والضغط يمين الشاشة • السحب للتصويب</div></div><div id="hud" class="hidden"><div class="topbar"><div class="hp"><span>❤</span><div><i id="hpbar"></i></div><b id="hptext">100</b></div><div class="score" id="score">0</div><div class="ammo"><b id="weaponName">RIFLE</b><span id="ammo">30/120</span></div></div><div class="mission" id="mission">المهمة: النجاة</div><div id="joystick"><div id="stick"></div></div><div class="actions"><button id="jump">▲</button><button id="jet">✈</button><button id="reload">↻</button><button id="grenade">✹</button></div><button id="pause">Ⅱ</button></div><div id="pausePanel" class="panel hidden"><h2>متوقف
